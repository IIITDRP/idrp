name: IDRP CI

on:
  push:
    branches:
      - main
      - 'automation/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: idrp_test
          POSTGRES_USER: idrp_test
          POSTGRES_PASSWORD: idrp_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idrp_test -d idrp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: idrp-backend/pom.xml

      - name: Verify backend
        working-directory: idrp-backend
        env:
          SPRING_PROFILES_ACTIVE: test
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/idrp_test
          TEST_DATABASE_USERNAME: idrp_test
          TEST_DATABASE_PASSWORD: idrp_test_password
        run: bash ./mvnw -B verify

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: idrp-frontend/package-lock.json

      - name: Install dependencies
        working-directory: idrp-frontend
        run: npm ci

      - name: Build frontend
        working-directory: idrp-frontend
        run: npm run build
