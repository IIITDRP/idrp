name: VPS SSH Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    name: Test VPS SSH Connection
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/idrp_key"
          chmod 600 "$HOME/.ssh/idrp_key"

          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test VPS connection
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/idrp_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            'echo "SSH connection successful"; whoami; hostname'
