# /etc/nginx/sites-available/idrp.conf  (symlink into sites-enabled)
# One domain serves everything:
#   /            -> built Vue app (/opt/idrp/frontend/current)
#   /api/        -> Spring Boot on 127.0.0.1:8080
#   /uploads/    -> admin-uploaded files, straight from disk (/var/idrp/uploads)
# TLS: obtain the certificate first (deploy/README.md step 6), then enable this file.
# For a staging hostname, replace www.idrp.in / idrp.in throughout.

limit_req_zone $binary_remote_addr zone=idrp_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name idrp.in www.idrp.in;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }  # certbot renewals
    location / { return 301 https://www.idrp.in$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name idrp.in;
    ssl_certificate     /etc/letsencrypt/live/www.idrp.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.idrp.in/privkey.pem;
    return 301 https://www.idrp.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.idrp.in;
    ssl_certificate     /etc/letsencrypt/live/www.idrp.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.idrp.in/privkey.pem;

    root /opt/idrp/frontend/current;
    index index.html;

    # Admin uploads go up to 100 MB (backend limit 110 MB request).
    client_max_body_size 110m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # ---- API -> Spring Boot (bound to localhost only)
    location /api/ {
        limit_req zone=idrp_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof their IP; Spring trusts this
        # header only because it comes from 127.0.0.1 (server.forward-headers-strategy=native).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Health endpoint for uptime monitoring (only /actuator/health is exposed by the app).
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
    }
    location /actuator/ { return 404; }

    # ---- Uploaded files: served by nginx, never executed, never sniffed as HTML.
    location /uploads/ {
        alias /var/idrp/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        expires 30d;
        try_files $uri =404;
    }

    # ---- Built assets have content hashes: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---- SPA: unknown paths fall back to the Vue router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
