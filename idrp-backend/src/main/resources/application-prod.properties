spring.application.name=idrp-backend

# Bind to localhost only - nginx on the same VPS is the public entry point.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}

# Trust X-Forwarded-For / X-Forwarded-Proto only from the local nginx proxy (Tomcat's
# RemoteIpValve). request.getRemoteAddr() is then the real client IP, which the rate
# limiter and audit log rely on.
server.forward-headers-strategy=native

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Flyway owns the schema; Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Auto-creates one SUPER_ADMIN on first startup if the admins table is empty.
# Only needed for the very first deploy; has no effect once any admin row exists.
app.admin.bootstrap-email=${INITIAL_ADMIN_EMAIL:}
app.admin.bootstrap-password=${INITIAL_ADMIN_PASSWORD:}

# Set SEED_STATIC_DATA=true only when you deliberately want to (re-)import the
# static frontend content. Defaults to false so production never auto-seeds.
app.seed-static-data=${SEED_STATIC_DATA:false}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:110MB}

app.upload.dir=${UPLOAD_DIR:/var/idrp/uploads}
app.upload.base-url=${UPLOAD_BASE_URL}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://idrp.in,https://www.idrp.in}

# Inquiry e-mail notifications (optional; inquiries are always stored in the DB).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.inquiry.notify-to=${INQUIRY_NOTIFY_TO:}
app.inquiry.notify-from=${MAIL_FROM:}
app.inquiry.admin-url=${PUBLIC_SITE_URL:https://idrp.in}

# Only the health endpoint is exposed - never widen this without also locking it
# down behind admin auth, since other actuator endpoints can leak internal details.
management.endpoints.web.exposure.include=health

# The mail health check would report DOWN whenever SMTP is not configured; inquiry
# notification is optional, so it must not fail the app health endpoint.
management.health.mail.enabled=false
